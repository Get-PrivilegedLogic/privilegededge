apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k3s
  labels:
    app: hello-k3s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-k3s
  template:
    metadata:
      labels:
        app: hello-k3s
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
